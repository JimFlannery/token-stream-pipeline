[project]
name = "token-stream-pipeline"
version = "0.1.0"
description = "Real-time crypto pricing pipeline (Coinbase + Pyth → Redpanda → PyFlink → ClickHouse → Grafana)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "httpx>=0.27",
    "websockets>=13.1",
    "confluent-kafka[avro,schemaregistry]>=2.6",
    "fastavro>=1.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "uvloop>=0.21 ; sys_platform != 'win32'",
]

[project.optional-dependencies]
flink = [
    "apache-flink>=1.20",
]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["producers"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
