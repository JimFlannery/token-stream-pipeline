# Full pipeline stack.
# Day 1 only needs: `docker compose up -d redpanda redpanda-console`
# Later days bring up: schema-registry, flink-jobmanager, flink-taskmanager, clickhouse, grafana.

services:

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: redpanda
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --smp=1
      - --default-log-level=info
    ports:
      - "19092:19092"   # Kafka API (external)
      - "18081:18081"   # Schema Registry (external)
      - "18082:18082"   # Pandaproxy / REST (external)
      - "9644:9644"     # Admin API
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    container_name: redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
    ports:
      - "8080:8080"

  # --- Added day 3 ------------------------------------------------------------
  flink-jobmanager:
    build: ./flink
    container_name: flink-jobmanager
    command: jobmanager
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8082:8081"   # Flink Web UI
    volumes:
      - ./flink-jobs:/opt/jobs:ro
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        rest.address: 0.0.0.0
      # Override .env localhost values with internal Docker hostnames
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - SCHEMA_REGISTRY_URL=http://redpanda:8081
    env_file: .env

  flink-taskmanager:
    build: ./flink
    container_name: flink-taskmanager
    command: taskmanager
    depends_on:
      - flink-jobmanager
    volumes:
      - ./flink-jobs:/opt/jobs:ro
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
      # Override .env localhost values with internal Docker hostnames
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - SCHEMA_REGISTRY_URL=http://redpanda:8081
    env_file: .env

  # --- Added day 5 ------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.10
    container_name: clickhouse
    depends_on:
      redpanda:
        condition: service_healthy
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    ports:
      - "8123:8123"   # HTTP interface (curl / Grafana)
      - "9000:9000"   # native TCP (clickhouse-client)
    volumes:
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Added day 6 ------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
